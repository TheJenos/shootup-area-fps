# Fast checks with no emulator or browser: types, unit tests, and the map generator over many seeds
# (every map valid, the same on every run, and unchanged unless GENERATOR_VERSION was bumped).
name: Checks

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - e2e/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.ts
      - .github/workflows/checks.yml
  pull_request:
    paths:
      - src/**
      - scripts/**
      - e2e/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.ts
      - .github/workflows/checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, unit tests and maps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:maps
