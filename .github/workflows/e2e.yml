# Plays the game end to end: Playwright drives real browsers (software WebGL) against the Realtime
# Database emulator. See README, "End-to-end tests".
name: End-to-end tests

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - e2e/**
      - index.html
      - database.rules.json
      - package.json
      - package-lock.json
      - playwright.config.ts
      - vite.config.ts
      - .env.e2e
      - .github/workflows/e2e.yml
  pull_request:
    paths:
      - src/**
      - public/**
      - e2e/**
      - index.html
      - database.rules.json
      - package.json
      - package-lock.json
      - playwright.config.ts
      - vite.config.ts
      - .env.e2e
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The database emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
